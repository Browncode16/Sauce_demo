            - generic [ref=f12e45]:
              - paragraph [ref=f12e46]: "In the world of digital transactions, where Switch Hub enables you to move money with remarkable speed, there’s a vital truth often overlooked: haste can lead to heartbreak. Many a fortune has been misdirected, not by hackers, but by a simple, tragic oversight – failing to verify."
              - paragraph [ref=f12e48]: Think of it as a pilot’s pre-flight checklist for your Switch Hub transfers. Would you board a plane if you knew the pilot skipped vital checks? Of course not. Your money transfers, especially when facilitating large sums or setting up payments for new beneficiaries through Switch Hub, deserve the same rigorous attention. The stakes are simply too high for assumptions.
              - paragraph [ref=f12e49]:
                - text: Scammers are cunning. They’ll mimic familiar names, alter a single digit in an account number, or create convincing invoices that lead straight to their pockets. Your
                - link "Switch Hub" [ref=f12e50] [cursor=pointer]:
                  - /url: https://switchhub.ca/about-us/
                - text: app or web platform might show a recipient name, but is it the
                - emphasis [ref=f12e51]: right
                - text: name linked to the
                - emphasis [ref=f12e52]: right
                - text: account? A quick glance is rarely enough.
              - paragraph [ref=f12e53]:
                - text: "The solution? A simple, yet profoundly powerful act:"
                - strong [ref=f12e54]: independent verification.
                - text: Don’t rely solely on the information provided in an email or text, even if it looks like it’s from a trusted source. If it’s a business, call their
                - emphasis [ref=f12e55]: official
                - text: number (found on their website, not in the email). If it’s an individual, ring them directly on a
                - emphasis [ref=f12e56]: known
                - text: number to confirm the details before you initiate that transfer on Switch Hub. A brief conversation can save you a world of regret.
              - paragraph [ref=f12e57]:
                - text: At
